name: Update football data

on:
  workflow_dispatch:

  schedule:
    # Viernes a lunes:
    # cada hora entre las 10:00 y las 22:00 UTC.
    #
    # En horario de verano español:
    # 12:00 - 00:00
    #
    # En horario de invierno:
    # 11:00 - 23:00
    - cron: "0 10-22 * * 0,1,5,6"

    # Martes, miércoles y jueves:
    # mantenemos solo algunas actualizaciones.
    - cron: "0 6,11,16,21 * * 2-4"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update Segunda Fila data
        env:
          OPENFOOT_API_KEY: ${{ secrets.OPENFOOT_API_KEY }}
        run: python scripts/update_data.py

      - name: Commit updated data
        run: |
          git config user.name "segunda-fila-bot"
          git config user.email "segunda-fila-bot@users.noreply.github.com"

          git add src/data/segunda.json

          if git diff --cached --quiet; then
            echo "No hay cambios en los datos"
          else
            git commit -m "Update football data"
            git push
          fi