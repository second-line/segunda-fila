name: Update football data

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"
    - cron: "0 11 * * *"
    - cron: "0 16 * * *"
    - cron: "0 21 * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update Segunda Fila data
        env:
          OPENFOOT_API_KEY: ${{ secrets.OPENFOOT_API_KEY }}
        run: python scripts/update_data.py

      - name: Commit updated data
        run: |
          git config user.name "segunda-fila-bot"
          git config user.email "segunda-fila-bot@users.noreply.github.com"
          git add src/data/segunda.json
          git diff --cached --quiet || git commit -m "Update football data"
          git push